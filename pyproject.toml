[project]
name = "epreuve-des-dieux"
version = "0.1.0"
description = "Site de suivi de L'Épreuve des Dieux (aventure Dofus 3 communautaire)"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "jinja2>=3.1",
    "sqlalchemy[asyncio]>=2.0.30",
    "asyncpg>=0.29",
    "alembic>=1.13",
    "pydantic-settings>=2.4",
    "httpx>=0.27",
    "pyyaml>=6.0",
    "python-multipart>=0.0.9",
    "nh3>=0.3.7",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "hypothesis>=6.100",
    "jsonschema>=4.23",
    "ruff>=0.6",
    "mini-racer>=0.14.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/epreuve"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
markers = [
    "db: tests contre un vrai Postgres (TEST_DATABASE_URL ; sautés si la base est injoignable)",
]

[tool.coverage.run]
branch = true

[tool.ruff]
line-length = 120
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S"]
ignore = ["S101"]  # assert est la façon normale d'écrire un test pytest

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106", "S603"]  # les tests lancent Alembic dans un sous-processus
