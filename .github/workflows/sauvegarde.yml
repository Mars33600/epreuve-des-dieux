# Sauvegarde nocturne de la base (ARCHITECTURE §5) : pg_dump du schéma « epreuve », gardé 30 jours
# comme artefact privé du dépôt. Secret à créer dans GitHub : DATABASE_URL_SAUVEGARDE, l'adresse
# Postgres au format libpq (postgresql://…, sans « +asyncpg »).
#
# Restauration (à tester une fois à la main, critère 17) :
#   télécharger l'artefact, puis  pg_restore --clean --if-exists -d "$URL" epreuve.dump
name: sauvegarde

on:
  schedule:
    - cron: "17 2 * * *"   # chaque nuit vers 3 h ou 4 h à Paris
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pg_dump:
    runs-on: ubuntu-latest
    steps:
      - name: Installer le client Postgres 16
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSo /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client-16
      - name: Sauvegarder
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL_SAUVEGARDE }}
        run: /usr/lib/postgresql/16/bin/pg_dump --format=custom --schema=epreuve --no-owner -f epreuve.dump "$DATABASE_URL"
      - uses: actions/upload-artifact@v4
        with:
          name: sauvegarde-${{ github.run_id }}
          path: epreuve.dump
          retention-days: 30
