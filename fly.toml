# Configuration Fly.io (ARCHITECTURE §10). Rien n'est déployé tant que Marceau n'a pas lancé `fly deploy`.
app = "epreuve-des-dieux"
primary_region = "cdg"            # Paris

[build]

# Lot A : pas de schéma à migrer. Le lot B remet la commande de release :
# les migrations passent AVANT la bascule vers la nouvelle version.
# [deploy]
#   release_command = "alembic upgrade head"

[env]
  # Réglages publics du mode (ARCHITECTURE §11). Les secrets passent par `fly secrets set`.
  SITE_MODE = "auto"                          # teaser jusqu'à SITE_OUVERT_LE, puis ouvert
  SITE_OUVERT_LE = "2026-11-13T17:00:00+01:00"
  FUSEAU = "Europe/Paris"
  SITE_PORT = "8080"
  JOURNAL_NIVEAU = "INFO"
  SITE_URL = "https://epreuve-des-dieux.fr"   # domaine retenu (Origin attendu, adresse de retour OAuth)

[http_service]
  internal_port = 8080
  force_https = true              # HTTP redirigé vers HTTPS
  auto_stop_machines = "off"      # pas de démarrage à froid le soir du reveal
  auto_start_machines = true
  min_machines_running = 1

  # Fly redémarre la machine si /sante ne répond plus.
  [[http_service.checks]]
    grace_period = "20s"
    interval = "30s"
    method = "GET"
    path = "/sante"
    timeout = "5s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"                # sans bot, le programme tient largement ; 512 Mo si les journaux montrent une pression
