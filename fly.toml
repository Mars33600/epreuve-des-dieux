# Configuration Fly.io (ARCHITECTURE §8). Rien n'est déployé tant que Marceau n'a pas créé le compte.
app = "epreuve-des-dieux"
primary_region = "cdg"            # Paris

[build]

[deploy]
  # Les migrations passent AVANT la bascule vers la nouvelle version.
  release_command = "alembic upgrade head"

[env]
  SITE_PORT = "8080"
  FUSEAU = "Europe/Paris"
  JOURNAL_NIVEAU = "INFO"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"      # un bot Discord ne doit jamais s'endormir
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    grace_period = "20s"
    interval = "30s"
    method = "GET"
    path = "/sante"
    timeout = "5s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
