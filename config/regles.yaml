# Règles de jeu (SPEC §8.1, EX-109). Changer une valeur puis redéployer : aucune modification de code.
# Les valeurs ci-dessous sont les réponses par défaut d'EXIGENCES.md.

palier:
  points_par_joueur: 2        # palier = ⌈ m × N × K ÷ 4 ⌉ ; « 5/2 » est accepté (fraction exacte)
  categorie_vide: ignoree     # T-11 : ignoree (K = catégories non vides) | offerte (point donné à tous, K = 4)

ouverture:
  automatique: true           # jauge pleine + étage suivant préparé + date plancher passée → le site l'ouvre seul ;
                              # false : seul un admin ouvre (l'ouverture manuelle, forcée ou non, reste toujours)
  delai_grace_secondes: 60    # la jauge doit rester pleine 60 s d'affilée avant l'ouverture (rattraper une coche
                              # par erreur) ; 0 : ouverture dès la coche qui la remplit

coches:
  succes_coche_vaincu: true   # T-16 : cocher un succès coche « Vaincre le boss » ; décocher celle-ci décoche les autres
  pause_peut_cocher: true     # T-13 : un grimpeur en pause peut cocher (ses points comptent à la réintégration)

inscription:
  liste_officielle_obligatoire: false  # T-19 ; SPEC-V5 §7 : « les officiels sont ceux du Discord »

fiche:
  classe_obligatoire: true    # T-20 ; obligatoire depuis le 04/11 (Shadoaze)
  afficher_nom_discord: true  # T-20

modules:
  verrouiller_par_etage: false  # T-08 (lot E)
  monde_des_douze: false        # SPEC-V5 §2 : true rallume encyclopédie, stuffs, builder, outils, archis, avis, fiche de quête

aventure:
  serveur: Mikhal              # Shadoaze, 10/11 : affiché dans les règles une fois le site ouvert, jamais sur le compte à rebours
