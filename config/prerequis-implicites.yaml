# Prérequis que Duffus écrit en toutes lettres sans lister les quêtes : on les ajoute au guide du Dofus,
# leurs propres prérequis compris (même fermeture que pour les quêtes listées par Duffus).
#
# Dofus Ivoire › « Alignement 100 » : « Vous devez faire les 100 quêtes d'alignement et être Ordre 5. »
# Duffus n'y liste que la 100e quête (L'exorciste / La danse macabre) ; les 99 autres s'enchaînent par le niveau
# d'alignement (critère Pa=…), pas par des prérequis de quête, et restaient donc secondaires (retour de Shadoaze
# du 04/11/2026). Liste : les quêtes du guide Duffus dont le titre figure dans les catégories DofusDB
# « Alignement Bonta » (9) et « Alignement Brâkmar » (10), relevé du 04/11/2026.
#
# Les autres consignes de ce genre dans les guides renvoient à un Dofus déjà retenu (« les 58 quêtes du Dofus
# Argenté », « les six Dofus Primordiaux »), à un boss ou à un rang : rien à ajouter.

